repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      # 禁止在长期受保护分支上直接提交 / Block direct commits on protected branches
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]

  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.9

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports]

  - repo: local
    hooks:
      - id: project-independence
        name: 项目独立性检查 / Project independence
        entry: python3 scripts/check_project_independence.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: project-independence-message
        name: 提交信息独立性检查 / Commit message independence
        entry: python3 scripts/check_project_independence.py --staged --message-file
        language: system
        always_run: true
        stages: [commit-msg]
      - id: project-independence-push
        name: 推送历史独立性检查 / Push history independence
        entry: python3 scripts/check_project_independence.py --commit-range HEAD
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
